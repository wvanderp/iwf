name: "🚀 NPM publish"

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release-tag:
        description: "Existing release tag to publish (for example, v1.2.3)"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: "🚀 Publish"
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release-tag }}

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - run: pnpm install --frozen-lockfile

      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

      - run: pnpm version --no-git-tag-version "$RELEASE_TAG"

      - run: pnpm run build

      - run: pnpm test

      - run: npm publish

