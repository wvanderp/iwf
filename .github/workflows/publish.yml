name: "🚀 NPM publish"

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release-tag:
        description: "Existing release tag to publish (for example, v1.2.3)"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: "🚀 Publish"
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release-tag }}

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Verify release tag matches package.json version
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if [ "$RELEASE_TAG" != "v$PACKAGE_VERSION" ]; then
            echo "::error::Release tag '$RELEASE_TAG' does not match package.json version '$PACKAGE_VERSION' (expected tag 'v$PACKAGE_VERSION')."
            exit 1
          fi

      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - run: pnpm install --frozen-lockfile

      - run: pnpm run build

      - run: pnpm test

      - run: npm publish

